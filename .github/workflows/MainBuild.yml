name: Main Build

on: 
  workflow_dispatch:

env:
  HAXE_VER: 4.3.4

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VER }}
          
      - name: Authenticate Git for Private Repositories
        run: git config --global url."https://${{ secrets.ORG_PAT_TOKEN }}@github.com/".insteadOf "git@github.com:"

      - name: Install Libraries
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install --quiet
          haxelib run libhxcpp setup
          haxe --cwd "$(haxelib libpath libhxcpp)/tools/hxcpp" compile.hxml
          
      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Compile
        run: haxelib run lime build android -release

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PsychEngine-Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    name: Build iOS
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VER }}
          
      - name: Authenticate Git for Private Repositories
        run: git config --global url."https://${{ secrets.ORG_PAT_TOKEN }}@github.com/".insteadOf "git@github.com:"
          
      - name: Install Libraries
        run: |
         haxelib install hmm --quiet
         haxelib run hmm install --quiet
         haxelib run libhxcpp setup
         haxe --cwd "$(haxelib libpath libhxcpp)/tools/hxcpp" compile.hxml

      - name: Compile
        run: haxelib run lime build ios -nosign

      - name: Making ipa file
        run: |
          brew install ldid
          cd export/release/ios/build/Release-iphoneos/PsychMobile0.7.3.app
          ldid -S../../../PsychMobile0.7.3/PsychMobile0.7.3.entitlements PsychMobile0.7.3
          cd ..
          mkdir Payload
          mv PsychMobile0.7.3.app Payload
          zip -r PsychMobile0.7.3.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PsychEngine-iOS
          path: export/release/ios/build/Release-iphoneos/*.ipa
          if-no-files-found: error

  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VER }}

      - name: Install Libraries
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install --quiet
          haxelib run libhxcpp setup
          haxe --cwd "$(haxelib libpath libhxcpp)/tools/hxcpp" compile.hxml

      - name: Compile
        run: haxelib run lime build windows -release

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PsychEngine-Windows
          path: export/release/windows/bin/
          if-no-files-found: error

  linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VER }}

      - name: Install LibVLC
        run: sudo apt-get install libvlc-dev libvlccore-dev

      - name: Authenticate Git for Private Repositories
        run: git config --global url."https://${{ secrets.ORG_PAT_TOKEN }}@github.com/".insteadOf "git@github.com:"
        
      - name: Install Libraries
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install --quiet
          haxelib run libhxcpp setup
          haxe --cwd "$(haxelib libpath libhxcpp)/tools/hxcpp" compile.hxml

      - name: Compile
        run: haxelib run lime build linux -release

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PsychEngine-Linux
          path: export/release/linux/bin/
          if-no-files-found: error

  macos:
    name: Build MacOS
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VER }}
          
      - name: Authenticate Git for Private Repositories
        run: git config --global url."https://${{ secrets.ORG_PAT_TOKEN }}@github.com/".insteadOf "git@github.com:"
        
      - name: Install Libraries
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install --quiete
          haxelib run libhxcpp setup
          haxe --cwd "$(haxelib libpath libhxcpp)/tools/hxcpp" compile.hxml

      - name: Compile
        run: haxelib run lime build mac -release

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PsychEngine-MacOS
          path: export/release/macos/bin/
          if-no-files-found: error
